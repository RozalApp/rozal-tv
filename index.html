<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rozal — TV-dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f1a0e; --paneel:#172616; --paneel2:#1d301b; --lijn:#2a4128;
    --tekst:#f3efe4; --grijs:#98a893; --groen:#7fc15a; --groen-d:#2D5016;
    --oranje:#f0a030; --rood:#e5604d; --blauw:#5aa9e6; --geel:#e8c547;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:#000; overflow:hidden; font-family:'DM Sans',system-ui,sans-serif; color:var(--tekst); }

  /* Het hele dashboard is 1920x1080 en wordt geschaald naar elk scherm (TV, monitor, laptop) */
  #canvas { position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform-origin:center center;
            background:radial-gradient(1200px 700px at 20% 0%, #1b3019 0%, var(--bg) 60%); padding:28px 36px 24px; display:flex; flex-direction:column; gap:20px; }

  /* ── Koptekst ── */
  .kop { display:flex; align-items:center; height:76px; flex-shrink:0; }
  .logo { font-family:'DM Serif Display',serif; font-size:44px; letter-spacing:1px; }
  .logo small { font-family:'DM Sans'; font-size:15px; letter-spacing:4px; color:var(--grijs); margin-left:14px; font-weight:600; }
  .kop-mid { flex:1; text-align:center; font-size:30px; font-weight:600; color:var(--tekst); text-transform:capitalize; }
  .kop-rechts { text-align:right; }
  .klok { font-size:56px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1; }
  .bijgewerkt { font-size:14px; color:var(--grijs); margin-top:4px; }
  .demo-badge { background:var(--oranje); color:#201400; font-weight:800; font-size:14px; padding:5px 12px; border-radius:20px; letter-spacing:1px; margin-left:20px; }

  /* ── Indeling: planning 3/4, widgets 1/4 ── */
  .hoofd { flex:1; display:grid; grid-template-columns:3fr 1fr; gap:22px; min-height:0; }
  .paneel { background:var(--paneel); border:1px solid var(--lijn); border-radius:20px; box-shadow:0 6px 30px rgba(0,0,0,.25); }

  /* ── Planning ── */
  .planning { display:flex; flex-direction:column; padding:20px 22px 18px; min-height:0; }
  .pl-kop { display:flex; align-items:center; gap:18px; margin-bottom:12px; }
  .pl-titel { font-size:24px; font-weight:700; }
  .legenda { display:flex; gap:16px; margin-left:auto; font-size:15px; color:var(--grijs); }
  .legenda span { display:flex; align-items:center; gap:7px; }
  .legenda i { width:12px; height:12px; border-radius:4px; display:inline-block; }
  .pl-grid { flex:1; position:relative; min-height:0; display:grid; grid-template-columns:70px repeat(5, 1fr); grid-template-rows:46px 1fr; }
  .pl-mon { display:flex; align-items:center; justify-content:center; gap:10px; font-size:21px; font-weight:700; border-bottom:2px solid var(--lijn); }
  .pl-mon .av { width:34px; height:34px; border-radius:50%; background:var(--groen-d); display:flex; align-items:center; justify-content:center; font-size:16px; }
  .pl-gutter, .pl-col { position:relative; }
  .pl-uur { position:absolute; left:0; right:0; font-size:15px; color:var(--grijs); transform:translateY(-9px); text-align:left; padding-left:6px; font-variant-numeric:tabular-nums; }
  .pl-lijn { position:absolute; left:0; right:0; border-top:1px solid rgba(255,255,255,.06); }
  .pl-col { border-left:1px solid rgba(255,255,255,.06); }
  .pl-col.vandaag { background:rgba(127,193,90,.06); }
  .pl-mon.vandaag { color:var(--groen); border-bottom-color:var(--groen); }
  .pl-mon small { font-size:15px; color:var(--grijs); font-weight:500; }
  .blok .mons { font-size:13px; color:rgba(255,255,255,.55); margin-top:1px; }
  .blok { position:absolute; border-radius:12px; padding:9px 12px; overflow:hidden; border-left:6px solid; background:var(--paneel2); transition:opacity .4s; }
  .blok .tijd { font-size:14px; color:rgba(255,255,255,.75); font-variant-numeric:tabular-nums; font-weight:600; display:flex; justify-content:space-between; gap:8px; }
  .blok .naam { font-size:17px; font-weight:700; line-height:1.15; margin-top:2px; }
  .blok .plaats { font-size:15px; color:rgba(255,255,255,.7); margin-top:1px; }
  .blok.klaar { opacity:.45; }
  .blok.bezig { box-shadow:0 0 0 2px var(--oranje), 0 0 22px rgba(240,160,48,.35); }
  .blok.onderweg { box-shadow:0 0 0 2px var(--blauw); }
  .st { font-size:14px; font-weight:700; padding:1px 8px; border-radius:10px; white-space:nowrap; }
  .st.klaar { background:rgba(127,193,90,.25); color:var(--groen); }
  .st.bezig { background:rgba(240,160,48,.25); color:var(--oranje); }
  .st.onderweg { background:rgba(90,169,230,.25); color:var(--blauw); }
  .nu-lijn { position:absolute; left:70px; right:0; border-top:3px solid var(--rood); z-index:5; pointer-events:none; }
  .nu-lijn::before { content:attr(data-tijd); position:absolute; left:-70px; top:-13px; background:var(--rood); color:#fff; font-size:14px; font-weight:800; padding:2px 7px; border-radius:6px; font-variant-numeric:tabular-nums; }
  .nu-lijn::after { content:''; position:absolute; right:0; top:-7px; width:11px; height:11px; border-radius:50%; background:var(--rood); }

  /* ── Widgets ── */
  .widgets { display:grid; grid-template-rows:300px 290px 1fr; gap:20px; min-height:0; }
  .widget { padding:18px 22px; display:flex; flex-direction:column; min-height:0; }
  .w-kop { display:flex; align-items:center; gap:10px; font-size:19px; font-weight:700; color:var(--grijs); text-transform:uppercase; letter-spacing:1.5px; }
  .w-kop .ic { font-size:24px; }
  .groot { font-size:92px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .groot small { font-size:34px; color:var(--grijs); font-weight:600; }

  .offerte-rij { display:flex; align-items:flex-end; gap:16px; margin-top:6px; }
  .spark { margin-left:auto; display:flex; align-items:flex-end; gap:6px; height:70px; }
  .spark div { width:16px; border-radius:4px 4px 0 0; background:rgba(127,193,90,.35); min-height:4px; }
  .spark div.vandaag { background:var(--groen); }
  .offerte-lijst { margin-top:auto; font-size:17px; }
  .offerte-lijst div { display:flex; justify-content:space-between; padding:5px 0; border-top:1px solid var(--lijn); }
  .offerte-lijst b { font-weight:600; }
  .offerte-lijst span { color:var(--grijs); font-variant-numeric:tabular-nums; }

  .taken-rij { display:flex; align-items:center; gap:22px; margin-top:8px; }
  .ring { position:relative; width:150px; height:150px; flex-shrink:0; }
  .ring svg { transform:rotate(-90deg); }
  .ring .mid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring .mid .groot { font-size:56px; }
  .taken-info { font-size:19px; display:flex; flex-direction:column; gap:10px; }
  .taken-info div { display:flex; align-items:center; gap:10px; }
  .taken-info i { width:13px; height:13px; border-radius:50%; display:inline-block; }
  .taken-info b { font-size:24px; margin-left:auto; padding-left:14px; }

  .mon-lijst { display:flex; flex-direction:column; gap:10px; margin-top:12px; flex:1; justify-content:space-between; }
  .mon { display:flex; align-items:center; gap:14px; padding:10px 12px; border-radius:14px; background:var(--paneel2); border-left:6px solid var(--grijs); }
  .mon.onderweg { border-color:var(--blauw); } .mon.bezig { border-color:var(--oranje); } .mon.klaar { border-color:var(--groen); }
  .mon .av { width:50px; height:50px; border-radius:50%; background:var(--groen-d); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; flex-shrink:0; }
  .mon .tekst { flex:1; min-width:0; }
  .mon .naam { font-size:22px; font-weight:700; }
  .mon .wat { font-size:16px; color:var(--grijs); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pil { font-size:15px; font-weight:800; padding:6px 12px; border-radius:20px; white-space:nowrap; text-align:center; }
  .pil.onderweg { background:rgba(90,169,230,.22); color:var(--blauw); }
  .pil.bezig { background:rgba(240,160,48,.22); color:var(--oranje); animation:puls 2s ease-in-out infinite; }
  .pil.klaar { background:rgba(127,193,90,.22); color:var(--groen); }
  .pil.wacht { background:rgba(255,255,255,.08); color:var(--grijs); }
  .actief { display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:14px; background:var(--paneel2); border-left:6px solid var(--grijs); }
  .actief.onderweg { border-color:var(--blauw); } .actief.bezig { border-color:var(--oranje); } .actief.klaar { border-color:var(--groen); }
  .actief .ico { font-size:38px; width:50px; text-align:center; flex-shrink:0; }
  .actief .klant { font-size:21px; font-weight:700; line-height:1.15; }
  .actief .sub { font-size:15px; color:var(--grijs); margin-top:2px; }
  @keyframes puls { 50% { opacity:.55; } }

  /* Demo-knop (alleen zichtbaar bij muis eroverheen) */
  .demo-knop { position:absolute; right:14px; bottom:8px; font-size:13px; color:var(--grijs); opacity:.25; cursor:pointer; user-select:none; }
  .demo-knop:hover { opacity:1; }

  /* ══ ANIMATIES ══ */
  #canvas::before { content:''; position:absolute; left:-200px; top:-200px; width:1000px; height:1000px; border-radius:50%;
    background:radial-gradient(circle, rgba(127,193,90,.13), transparent 65%); animation:zweef 28s ease-in-out infinite alternate; pointer-events:none; }
  .kop, .hoofd { position:relative; z-index:1; }
  @keyframes zweef { to { transform:translate(1100px, 650px); } }
  @keyframes paneelin { from { opacity:0; transform:translateY(30px) scale(.97); } }
  .paneel { animation:paneelin .9s cubic-bezier(.2,.8,.2,1) backwards; }
  .planning { animation-delay:.1s; } #wOfferte { animation-delay:.3s; } #wTaken { animation-delay:.45s; } #wMonteurs { animation-delay:.6s; }
  @keyframes blokin { from { opacity:0; transform:translateY(14px) scale(.96); } }
  .blok { animation:blokin .6s cubic-bezier(.2,.8,.2,1) backwards; }
  .blok.bezig::after { content:''; position:absolute; inset:-2px; border-radius:14px; pointer-events:none; animation:gloed 2.4s ease-in-out infinite; }
  @keyframes gloed { 0%,100% { box-shadow:0 0 0 2px rgba(240,160,48,.9), 0 0 6px rgba(240,160,48,.2); } 50% { box-shadow:0 0 0 2px rgba(240,160,48,.5), 0 0 26px rgba(240,160,48,.55); } }
  .nu-lijn::after { animation:nupuls 1.6s ease-in-out infinite; }
  @keyframes nupuls { 0%,100% { box-shadow:0 0 0 0 rgba(229,96,77,.7); } 50% { box-shadow:0 0 0 10px rgba(229,96,77,0); } }
  .nu-lijn { transition:top 1s linear; }
  .dp { animation:knip 1s steps(1) infinite; } @keyframes knip { 50% { opacity:.2; } }
  /* staafdiagram groeit omhoog */
  @keyframes groei { from { transform:scaleY(0); } }
  .spark div { transform-origin:bottom; animation:groei .9s cubic-bezier(.2,1.1,.3,1) backwards; }
  .spark div.vandaag { animation:groei .9s cubic-bezier(.2,1.1,.3,1) backwards, gloedgroen 2.2s ease-in-out 1.2s infinite; }
  @keyframes gloedgroen { 50% { box-shadow:0 0 16px rgba(127,193,90,.8); filter:brightness(1.25); } }
  @keyframes popin { from { transform:scale(.5); opacity:0; } 60% { transform:scale(1.12); } }
  .groot { animation:popin .7s cubic-bezier(.2,.9,.3,1.2) backwards; }
  @keyframes schuif { from { opacity:0; transform:translateX(24px); } }
  .offerte-lijst div { animation:schuif .6s cubic-bezier(.2,.8,.2,1) backwards; } .offerte-lijst div:nth-child(2) { animation-delay:.15s; }
  /* ring tekent zichzelf */
  @keyframes tekenring { from { stroke-dasharray:0 var(--O); } }
  .seg { animation:tekenring 1.4s cubic-bezier(.3,.7,.2,1) backwards; }
  .ring svg { animation:draai 1.4s cubic-bezier(.3,.7,.2,1) backwards; } @keyframes draai { from { transform:rotate(-200deg); } }
  .taken-info div { animation:schuif .6s cubic-bezier(.2,.8,.2,1) backwards; }
  .taken-info div:nth-child(2) { animation-delay:.1s; } .taken-info div:nth-child(3) { animation-delay:.2s; } .taken-info div:nth-child(4) { animation-delay:.3s; }
  .taken-info i.pd { animation:dotpuls 1.4s ease-in-out infinite; } @keyframes dotpuls { 50% { transform:scale(1.7); opacity:.5; } }
  /* monteurs */
  .actief { animation:schuif .6s cubic-bezier(.2,.8,.2,1) backwards; position:relative; }
  .actief .ico { display:inline-block; }
  .actief .ico-onderweg { animation:rijd 1.8s ease-in-out infinite alternate; }
  @keyframes rijd { 0% { transform:translateX(-7px) translateY(0); } 25% { transform:translateX(-3px) translateY(-2px); } 50% { transform:translateX(0) translateY(0); } 75% { transform:translateX(4px) translateY(-2px); } 100% { transform:translateX(8px) translateY(0); } }
  .actief .ico-bezig { animation:hamer 1.1s ease-in-out infinite; transform-origin:30% 80%; }
  @keyframes hamer { 0%,100% { transform:rotate(-25deg); } 50% { transform:rotate(20deg); } }
  .actief .ico-klaar { animation:popin .8s cubic-bezier(.2,.9,.3,1.3) backwards; }
  .actief.onderweg { background-image:repeating-linear-gradient(90deg, rgba(90,169,230,.55) 0 16px, transparent 16px 32px); background-size:32px 3px; background-repeat:repeat-x; background-position:0 100%; animation:schuif .6s backwards, weg 1s linear infinite; }
  @keyframes weg { to { background-position:-32px 100%; } }
  .actief.bezig { animation:schuif .6s backwards, rijrand 2.4s ease-in-out infinite; }
  @keyframes rijrand { 50% { background-color:#2a3a1f; } }

  /* opleverfoto's */
  .fotokader { position:relative; flex:1; margin-top:12px; border-radius:14px; overflow:hidden; background:#0b140a; min-height:0; }
  .foto { position:absolute; inset:0; opacity:0; transition:opacity 1.4s ease; }
  .foto.aan { opacity:1; }
  .foto svg { width:100%; height:100%; display:block; transform-origin:60% 60%; }
  .foto.aan svg { animation:kb 9s ease-out forwards; }
  @keyframes kb { from { transform:scale(1); } to { transform:scale(1.13); } }
  .foto .cap { position:absolute; left:0; right:0; bottom:0; padding:30px 18px 14px; background:linear-gradient(transparent, rgba(0,0,0,.78)); }
  .foto.aan .cap { animation:capin .9s .4s cubic-bezier(.2,.8,.2,1) backwards; }
  @keyframes capin { from { opacity:0; transform:translateY(16px); } }
  .cap b { display:block; font-size:24px; } .cap span { font-size:16px; color:rgba(255,255,255,.8); }
  .stippen { position:absolute; right:14px; top:12px; display:flex; gap:6px; z-index:2; }
  .stippen i { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.35); transition:all .4s; }
  .stippen i.aan { background:#fff; width:24px; border-radius:6px; }
  .demo-tag { position:absolute; left:12px; top:12px; z-index:2; font-size:12px; background:rgba(0,0,0,.5); padding:3px 8px; border-radius:8px; color:#ddd; }
  /* weekdoel */
  .doel { margin-top:10px; }
  .doel .rij { display:flex; justify-content:space-between; font-size:16px; color:var(--grijs); margin-bottom:6px; }
  .doel .rij b { color:var(--tekst); }
  .balk { height:14px; border-radius:8px; background:rgba(255,255,255,.08); overflow:hidden; }
  .balk div { height:100%; border-radius:8px; background:linear-gradient(90deg,#4f9a3b,#a6e07a); width:var(--w); animation:vul 1.6s cubic-bezier(.3,.8,.2,1) backwards; position:relative; overflow:hidden; }
  .balk div::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent); transform:translateX(-100%); animation:glans 2.8s ease-in-out 1.6s infinite; }
  @keyframes vul { from { width:0; } } @keyframes glans { to { transform:translateX(100%); } }
  .record { display:inline-block; margin-top:8px; font-size:15px; font-weight:800; padding:4px 12px; border-radius:20px; background:rgba(232,197,71,.18); color:var(--geel); animation:popin .7s backwards; }
  .record.nieuw { background:var(--geel); color:#2a2000; animation:popin .7s backwards, recordpuls 1.2s ease-in-out infinite; }
  @keyframes recordpuls { 50% { transform:scale(1.07); } }

  .foto img { width:100%; height:100%; object-fit:cover; display:block; transform-origin:60% 60%; }
  .foto.aan img { animation:kb 9s ease-out forwards; }
  .leeg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--grijs); font-size:18px; text-align:center; padding:20px; }
  #login { position:absolute; inset:0; z-index:50; background:rgba(8,14,7,.94); display:none; flex-direction:column; align-items:center; justify-content:center; gap:26px; }
  #login .logo { font-size:80px; } #login p { font-size:26px; color:var(--grijs); }
  #login button { font:700 28px 'DM Sans',sans-serif; padding:18px 44px; border-radius:16px; border:0; background:var(--groen); color:#10200a; cursor:pointer; }
  #melding { position:absolute; left:50%; bottom:6px; transform:translateX(-50%); font-size:14px; color:var(--oranje); z-index:5; }
</style>
</head>
<body>
<div id="canvas">
  <div class="kop">
    <div class="logo">ROZAL<small>ZONWERING</small></div>
    <div class="kop-mid" id="datum"></div>
    <div class="kop-rechts"><div class="klok" id="klok">--:--</div><div class="bijgewerkt" id="bijgewerkt">Laden…</div></div>
  </div>
  <div class="hoofd">
    <div class="paneel planning">
      <div class="pl-kop">
        <div class="pl-titel">📅 Planning deze week</div>
        <div class="legenda">
          <span><i style="background:#4f9a3b"></i>Montage</span>
          <span><i style="background:#e5604d"></i>Reparatie</span>
          <span><i style="background:#f0a030"></i>Inmeten</span>
          <span><i style="background:#5aa9e6"></i>Showroom</span>
        </div>
      </div>
      <div class="pl-grid" id="plGrid"></div>
    </div>
    <div class="widgets">
      <div class="paneel widget" id="wOfferte"></div>
      <div class="paneel widget" id="wFotos"></div>
      <div class="paneel widget" id="wMonteurs"></div>
    </div>
  </div>
  <div id="melding"></div>
  <div id="login"><div class="logo">ROZAL</div><p id="loginTekst">Log in om het dashboard te tonen</p><button id="loginKnop">Inloggen met Microsoft</button></div>
</div>
<script src="msal-browser.min.js"></script>
<script>
// ══════════════════════════════════════════════════════════════
//  ROZAL TV-DASHBOARD — LIVE
//  Alleen lezen. Bronnen (SharePoint, via dezelfde Microsoft-login als de iPhone-app):
//    planning  → rozal_planning.xlsx        offertes → RozalApp/Offertes.xlsx (Blad1)
//    taken     → TaakRegistratie.xlsx       foto's   → RozalApp/Opleverfoto's
// ══════════════════════════════════════════════════════════════
const CONFIG = {
  tenantId: '9adf6406-9d51-428d-9c5d-34a46087b7a8',
  clientId: '81f2417d-ac40-457b-8f28-302fd9952be4',
  spHost:   'rozal.sharepoint.com',
  docPad:   'Rozal/Documenten ROZAL',
  // Moet exact overeenkomen met wat in Azure -> Authentication staat (en met de GitHub-pagina-URL):
  redirectUri: 'https://rozalapp.github.io/rozal-tv/',
};
const WEEKDOEL = 20;                       // offertes per week
const SCOPES = ['User.Read', 'Sites.Read.All', 'Files.Read.All'];
const VERVERS_MS = 60000, FOTO_VERVERS_MS = 600000;

const TYPE_KLEUR = { Montage:'#4f9a3b', Reparatie:'#e5604d', Inmeten:'#f0a030', Showroom:'#5aa9e6' };
const DAGNAMEN = ['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag'];

// ── Helpers ───────────────────────────────────────────────────
const pad2 = n => String(n).padStart(2, '0');
const m = t => { const [h, mi] = String(t).split(':').map(Number); return h * 60 + mi; };
const uurMin = min => pad2(Math.floor(min / 60)) + ':' + pad2(Math.floor(min % 60));
const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const nuMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const isoVan = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const W = id => ({ set innerHTML(h) { zet(id, h); } });
function zet(id, html) {                    // alleen vernieuwen als er iets veranderd is -> animaties blijven doorlopen
  const e = document.getElementById(id);
  if (e._h === html) return;
  e._h = html; e.innerHTML = html;
  e.querySelectorAll('[data-tel]').forEach(el => {
    const doel = +el.dataset.tel, t0 = performance.now();
    (function stap(t) { const p = Math.min(1, (t - t0) / 1100); el.textContent = Math.round(doel * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(stap); })(t0);
  });
}
function excelDatumNaarIso(v) {
  if (v === null || v === undefined || v === '') return '';
  const n = Number(v);
  if (!isNaN(n) && n > 40000 && n < 60000) return new Date(Date.UTC(1899, 11, 30) + Math.floor(n) * 86400000).toISOString().slice(0, 10);
  let s = String(v).trim(); if (s.includes('T')) s = s.split('T')[0]; if (s.includes(' ')) s = s.split(' ')[0];
  let a = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if (a) return a[1] + '-' + pad2(+a[2]) + '-' + pad2(+a[3]);
  a = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/); if (a) return a[3] + '-' + pad2(+a[2]) + '-' + pad2(+a[1]);
  return '';
}
function excelTijdTekst(v) {
  if (v === null || v === undefined || v === '' || v === 0) return '';
  if (typeof v === 'number') { const mins = Math.round((v - Math.floor(v)) * 1440) % 1440; return pad2(Math.floor(mins / 60)) + ':' + pad2(mins % 60); }
  const a = String(v).match(/(\d{1,2}):(\d{2})/); return a ? pad2(+a[1]) + ':' + a[2] : '';
}
function plaatsUitAdres(adres) {
  const s = String(adres || '').trim(); if (!s) return '';
  const pc = s.match(/\d{4}\s?[A-Za-z]{2}\s+(.+)$/);        // "… 5388 AB Plaats"
  if (pc) return pc[1].trim();
  const delen = s.split(',').map(x => x.trim()).filter(Boolean);
  return delen.length > 1 ? delen[delen.length - 1].replace(/^\d{4}\s?[A-Za-z]{2}\s*/, '') : s;
}

// ── Week ──────────────────────────────────────────────────────
const NU = new Date();
const _wd = (NU.getDay() + 6) % 7;                       // 0 = maandag
const ECHTE_MAANDAG = new Date(NU.getFullYear(), NU.getMonth(), NU.getDate() - _wd);
const MAANDAG = _wd > 4 ? new Date(ECHTE_MAANDAG.getTime() + 7 * 86400000) : ECHTE_MAANDAG;   // in het weekend: volgende week tonen
const HEUTE = _wd > 4 ? -1 : _wd;
const WEEKDATA = DAGNAMEN.map((_, i) => { const d = new Date(MAANDAG); d.setDate(d.getDate() + i); return d; });

// ── Auth (MSAL, zelfde aanpak als de iPhone-app) ─────────────
let msalI = null, acct = null;
async function startAuth() {
  msalI = new msal.PublicClientApplication({
    auth: { clientId: CONFIG.clientId, authority: 'https://login.microsoftonline.com/' + CONFIG.tenantId, redirectUri: CONFIG.redirectUri },
    cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: true },
  });
  await msalI.initialize();
  let r = null;
  try { r = await msalI.handleRedirectPromise(); }
  catch (e) { console.warn('Redirect mislukt', e); history.replaceState(null, '', location.pathname + location.search); }
  if (r && r.account) acct = r.account; else { const a = msalI.getAllAccounts(); if (a.length) acct = a[0]; }
  if (acct) msalI.setActiveAccount(acct);
  return !!acct;
}
function toonLogin(tekst) {
  document.getElementById('loginTekst').textContent = tekst || 'Log in om het dashboard te tonen';
  document.getElementById('login').style.display = 'flex';
}
document.getElementById('loginKnop').onclick = async () => {
  try { await msalI.loginRedirect({ scopes: SCOPES }); } catch (e) { console.warn(e); }
};
async function token() {
  try { return (await msalI.acquireTokenSilent({ scopes: SCOPES, account: acct })).accessToken; }
  catch (e) { toonLogin('Sessie verlopen — log opnieuw in'); throw e; }
}
async function graphGet(url) {
  for (let poging = 0; ; poging++) {
    const t = await token();
    const r = await fetch('https://graph.microsoft.com/v1.0' + url, { headers: { Authorization: 'Bearer ' + t } });
    if (r.ok) return r.json();
    if ([429, 502, 503, 504].includes(r.status) && poging < 2) { await new Promise(res => setTimeout(res, 2000 * (poging + 1))); continue; }
    const e = new Error('Graph ' + r.status + ': ' + url); e.status = r.status; throw e;
  }
}

// ── Data laden ────────────────────────────────────────────────
let TAKEN = [], REGISTRATIE = {}, OFFERTES = [], FOTOLIJST = [];
let _planFile = null, _taakFile = null, _offFile = null, _fotoMap = null, laatstGeladen = null;

async function laadPlanning() {
  if (!_planFile) {
    let file = null;
    for (const term of ['rozal_planning', 'planning']) {
      const z = await graphGet(`/sites/${CONFIG.spHost}/drive/root/search(q='${term}.xlsx')`);
      file = (z.value || []).find(i => i.name && i.name.toLowerCase().endsWith('.xlsx') && i.name.toLowerCase().includes('planning'));
      if (file) break;
    }
    if (!file) throw new Error('Planning niet gevonden');
    const driveId = file.parentReference.driveId;
    const ws = await graphGet(`/drives/${driveId}/items/${file.id}/workbook/worksheets`);
    _planFile = { driveId, id: file.id, ws: ws.value[0].name };
  }
  const b = await graphGet(`/drives/${_planFile.driveId}/items/${_planFile.id}/workbook/worksheets/${encodeURIComponent(_planFile.ws)}/usedRange`);
  const rijen = b.values || [], lijst = [];
  const isoWeek = WEEKDATA.map(isoVan);
  for (let r = 3; r < rijen.length; r++) {
    const x = rijen[r];
    if (!x[1] || typeof x[1] !== 'number') continue;
    const dag = isoWeek.indexOf(excelDatumNaarIso(x[1]));
    if (dag < 0) continue;
    const van = excelTijdTekst(x[2]) || '08:00';
    const duur = parseInt(x[3]) || 60;
    lijst.push({
      nr: r, dag, van, tot: uurMin(Math.min(23 * 60 + 59, m(van) + duur)),
      type: String(x[4] || ''), klant: String(x[5] || '').trim(), plaats: plaatsUitAdres(x[6]),
      monteurs: String(x[7] || '').split(',').map(s => s.trim()).filter(Boolean),
    });
  }
  TAKEN = lijst;
}

async function laadRegistratie() {
  if (!_taakFile) {
    const z = await graphGet(`/sites/${CONFIG.spHost}/drive/root/search(q='TaakRegistratie')`);
    const file = (z.value || []).find(f => f.name && f.name.toLowerCase().includes('taakregistratie') && f.name.toLowerCase().endsWith('.xlsx'));
    if (!file) throw new Error('TaakRegistratie niet gevonden');
    const driveId = file.parentReference.driveId;
    const ws = await graphGet(`/drives/${driveId}/items/${file.id}/workbook/worksheets`);
    const w = (ws.value || []).find(s => s.name === 'Taken') || ws.value[0];
    _taakFile = { driveId, id: file.id, ws: w.name };
  }
  const b = await graphGet(`/drives/${_taakFile.driveId}/items/${_taakFile.id}/workbook/worksheets/${encodeURIComponent(_taakFile.ws)}/usedRange`);
  const reg = {};
  (b.values || []).slice(1).forEach(r => {
    const klant = String(r[1] || '').trim(); if (!klant) return;
    const datum = excelDatumNaarIso(r[2]);
    const klaar = excelTijdTekst(r[5]), bij = excelTijdTekst(r[4]), onderweg = excelTijdTekst(r[3]);
    const kol = String(r[10] || '').trim();
    const st = kol || (klaar ? 'klaar' : bij ? 'bij_klant' : onderweg ? 'onderweg' : '');
    if (st) reg[klant.toLowerCase() + '|' + datum] = st;
  });
  REGISTRATIE = reg;
}

async function laadOffertes() {
  if (!_offFile) {
    const f = await graphGet(`/sites/${CONFIG.spHost}/drive/root:/Rozal/Documenten%20ROZAL/RozalApp/Offertes.xlsx`);
    if (!f || !f.id) throw new Error('Offertes.xlsx niet gevonden');
    _offFile = { driveId: f.parentReference.driveId, id: f.id };
  }
  const b = await graphGet(`/drives/${_offFile.driveId}/items/${_offFile.id}/workbook/worksheets/Blad1/usedRange`);
  OFFERTES = (b.values || []).slice(1).map((r, i) => ({ rij: i, nr: r[0], datum: excelDatumNaarIso(r[1]), naam: String(r[3] || ''), plaats: String(r[5] || '') }))
    .filter(o => (o.nr !== '' || o.naam) && o.datum);
}

const FOTO_MAPNAMEN = ["Opleverfoto's", 'Opleverfoto’s', 'Opleverfotos'];
const encPad = p => p.split('/').map(s => encodeURIComponent(s).replace(/'/g, '%27')).join('/');
async function laadFotos() {
  const basis = CONFIG.docPad + '/RozalApp/';
  let items = null;
  for (const pad of (_fotoMap ? [_fotoMap] : FOTO_MAPNAMEN.map(n => basis + n))) {
    try {
      let d = await graphGet(`/sites/${CONFIG.spHost}/drive/root:/${encPad(pad)}:/children?$select=id,name&$expand=thumbnails&$top=999`);
      items = d.value || [];
      for (let g = 0; d['@odata.nextLink'] && g < 20; g++) { d = await graphGet(String(d['@odata.nextLink']).replace('https://graph.microsoft.com/v1.0', '')); items = items.concat(d.value || []); }
      _fotoMap = pad; break;
    } catch (e) { if (e.status && e.status !== 404) throw e; }
  }
  const fotos = [];
  (items || []).forEach(f => {
    const a = String(f.name || '').match(/^(.+)_(\d{4}-\d{2}-\d{2})_(\d{3,6})_(\d+)\.jpe?g$/i); if (!a) return;
    const th = f.thumbnails && f.thumbnails[0];
    const url = th ? ((th.large && th.large.url) || (th.medium && th.medium.url) || (th.small && th.small.url)) : null;
    if (url) fotos.push({ id: f.id, klant: a[1].replace(/_+/g, ' ').trim(), datum: a[2], tijd: a[3], nr: +a[4], url });
  });
  fotos.sort((x, y) => (y.datum + y.tijd).localeCompare(x.datum + x.tijd) || y.nr - x.nr);
  FOTOLIJST = fotos.slice(0, 12);
}

// ── Status van een taak ───────────────────────────────────────
function bepaalStatus(t) {
  if (HEUTE < 0 || t.dag > HEUTE) return 'gepland';
  if (t.dag < HEUTE) return 'klaar';
  const reg = REGISTRATIE[t.klant.toLowerCase() + '|' + isoVan(WEEKDATA[t.dag])];
  if (reg === 'klaar') return 'klaar';
  if (reg === 'bij_klant') return 'bezig';
  if (reg === 'onderweg') return 'onderweg';
  if (t.type !== 'Montage' && t.type !== 'Reparatie' && nuMin() >= m(t.tot)) return 'klaar';   // inmeten/showroom worden niet op de tablet geregistreerd
  return 'gepland';
}

// ── Planning (week, een kolom per dag) ────────────────────────
let DAG_VAN = 8 * 60, DAG_TOT = 18 * 60, uitschaal = 1, _plSig = '', _plY = null;
function tekenPlanning() {
  let v = 8 * 60, tt = 18 * 60;
  TAKEN.forEach(x => { v = Math.min(v, Math.floor(m(x.van) / 60) * 60); tt = Math.max(tt, Math.ceil(m(x.tot) / 60) * 60); });
  DAG_VAN = v; DAG_TOT = tt;
  const grid = document.getElementById('plGrid');
  const sig = TAKEN.map(x => x.nr + x.st + x.van + x.tot + x.klant).join() + '|' + uitschaal + '|' + innerWidth + '|' + DAG_VAN + DAG_TOT;
  if (sig === _plSig && _plY) {
    const l = grid.querySelector('.nu-lijn');
    if (l) { l.dataset.tijd = uurMin(nuMin()); l.style.top = (grid.querySelector('.pl-gutter').offsetTop + _plY(nuMin())) + 'px'; return; }
  }
  _plSig = sig;
  const uren = []; for (let u = DAG_VAN / 60; u <= DAG_TOT / 60; u++) uren.push(u);
  let html = '<div></div>' + DAGNAMEN.map((n, i) => `<div class="pl-mon ${i === HEUTE ? 'vandaag' : ''}">${n.slice(0, 2)} <small>${WEEKDATA[i].getDate()}/${WEEKDATA[i].getMonth() + 1}</small></div>`).join('');
  html += '<div class="pl-gutter" id="plGutter"></div>' + DAGNAMEN.map((n, i) => `<div class="pl-col ${i === HEUTE ? 'vandaag' : ''}" id="plCol${i}"></div>`).join('');
  grid.innerHTML = html;
  const hoogte = document.getElementById('plGutter').getBoundingClientRect().height / uitschaal;
  const perMin = hoogte / (DAG_TOT - DAG_VAN);
  const y = min => (min - DAG_VAN) * perMin;
  _plY = y;
  document.getElementById('plGutter').innerHTML = uren.map(u => `<div class="pl-uur" style="top:${y(u * 60)}px">${pad2(u)}:00</div>`).join('');
  DAGNAMEN.forEach((n, i) => {
    let h = uren.map(u => `<div class="pl-lijn" style="top:${y(u * 60)}px"></div>`).join('');
    const taken = TAKEN.filter(t => t.dag === i).sort((a, b) => m(a.van) - m(b.van));
    const baanEind = [];
    taken.forEach(t => { let k = baanEind.findIndex(e => e <= m(t.van)); if (k < 0) { k = baanEind.length; baanEind.push(0); } baanEind[k] = m(t.tot); t._baan = k; });
    const banen = Math.max(1, baanEind.length);
    taken.forEach(t => {
      const top = y(m(t.van)), hh = Math.max(40, y(m(t.tot)) - top - 3), br = 100 / banen;
      const ico = t.st === 'klaar' ? '✅' : t.st === 'bezig' ? '🔧' : t.st === 'onderweg' ? '🚐' : '';
      h += `<div class="blok ${t.st}" style="top:${top}px;height:${hh}px;left:calc(${t._baan * br}% + 4px);width:calc(${br}% - 8px);border-color:${TYPE_KLEUR[t.type] || '#98a893'};animation-delay:${(t.nr * 53) % 600 + 200}ms">
        <div class="tijd"><span>${t.van}–${t.tot}</span><span>${ico}</span></div>
        <div class="naam">${esc(t.klant)}</div><div class="plaats">${esc(t.type)}${t.plaats ? ' · ' + esc(t.plaats) : ''}</div>
        <div class="mons">${esc(t.monteurs.join(' + '))}</div></div>`;
    });
    document.getElementById('plCol' + i).innerHTML = h;
  });
  if (HEUTE >= 0 && nuMin() >= DAG_VAN && nuMin() <= DAG_TOT) {
    const l = document.createElement('div');
    l.className = 'nu-lijn'; l.dataset.tijd = uurMin(nuMin());
    l.style.top = (grid.querySelector('.pl-gutter').offsetTop + y(nuMin())) + 'px';
    grid.appendChild(l);
  }
}

// ── Widget 1: offertes vandaag + dagrecord + weekdoel ─────────
function tekenOffertes() {
  const vandaag = isoVan(NU), perDag = {};
  OFFERTES.forEach(o => { perDag[o.datum] = (perDag[o.datum] || 0) + 1; });
  const n = perDag[vandaag] || 0;
  const reeks = []; for (let i = 6; i >= 1; i--) { const d = new Date(NU.getFullYear(), NU.getMonth(), NU.getDate() - i); reeks.push(perDag[isoVan(d)] || 0); }
  reeks.push(n);
  const max = Math.max(...reeks, 1);
  const record = Math.max(0, ...Object.keys(perDag).filter(d => d < vandaag).map(d => perDag[d]));
  let week = 0; for (let i = 0; i <= 6; i++) { const d = new Date(ECHTE_MAANDAG); d.setDate(d.getDate() + i); week += perDag[isoVan(d)] || 0; }
  const pct = Math.min(100, Math.round(week / WEEKDOEL * 100));
  const rec = record === 0 ? '' : n > record ? '<div class="record nieuw">🏆 Nieuw dagrecord!</div>'
            : n === record ? '<div class="record nieuw">🏆 Gelijk aan dagrecord!</div>'
            : `<div class="record">🏆 Nog ${record - n + 1} voor een nieuw dagrecord</div>`;
  const laatste = OFFERTES.filter(o => o.datum === vandaag).sort((a, b) => b.rij - a.rij).slice(0, 2);
  W('wOfferte').innerHTML = `
    <div class="w-kop"><span class="ic">📄</span>Offertes vandaag</div>
    <div class="offerte-rij"><div class="groot" data-tel="${n}">${n}</div>
      <div class="spark">${reeks.map((val, i) => `<div class="${i === reeks.length - 1 ? 'vandaag' : ''}" style="height:${Math.max(6, val / max * 70)}px;animation-delay:${i * 110}ms"></div>`).join('')}</div></div>
    ${rec}
    <div class="doel"><div class="rij"><span>Weekdoel offertes</span><span><b>${week}</b> / ${WEEKDOEL}</span></div><div class="balk"><div style="--w:${pct}%"></div></div></div>`;
}

// ── Widget 2: opleverfoto's ───────────────────────────────────
let _fotoIdx = 0, _fotoSig = '';
function tekenFotos() {
  const el = document.getElementById('wFotos');
  const sig = FOTOLIJST.map(f => f.id).join();
  if (sig === _fotoSig && el._gebouwd) {                 // zelfde foto's: alleen de (verlopende) links verversen
    el.querySelectorAll('.foto img').forEach((img, i) => { if (FOTOLIJST[i] && img.src !== FOTOLIJST[i].url) img.src = FOTOLIJST[i].url; });
    return;
  }
  _fotoSig = sig; el._gebouwd = true; _fotoIdx = 0;
  const nl = d => d.split('-').reverse().join('-');
  el.innerHTML = `<div class="w-kop"><span class="ic">📷</span>Net opgeleverd</div>
    <div class="fotokader">${FOTOLIJST.length ? `<div class="stippen">${FOTOLIJST.map((_, i) => `<i class="${i === 0 ? 'aan' : ''}"></i>`).join('')}</div>
      ${FOTOLIJST.map((f, i) => `<div class="foto ${i === 0 ? 'aan' : ''}"><img src="${esc(f.url)}" alt=""><div class="cap"><b>${esc(f.klant)}</b><span>${nl(f.datum)}</span></div></div>`).join('')}` : '<div class="leeg">Nog geen opleverfoto\'s</div>'}</div>`;
}
setInterval(() => {
  const fs = document.querySelectorAll('#wFotos .foto'), st = document.querySelectorAll('#wFotos .stippen i');
  if (fs.length < 2) return;
  fs[_fotoIdx].classList.remove('aan'); st[_fotoIdx].classList.remove('aan');
  _fotoIdx = (_fotoIdx + 1) % fs.length;
  fs[_fotoIdx].classList.add('aan'); st[_fotoIdx].classList.add('aan');
}, 6000);

// ── Widget 3: monteurs zijn nu bij ────────────────────────────
function tekenMonteurs() {
  const taken = TAKEN.filter(t => t.dag === HEUTE).sort((a, b) => m(a.van) - m(b.van));
  const rij = (cls, ico, klant, sub) => `<div class="actief ${cls}"><div class="ico ico-${cls}">${ico}</div><div><div class="klant">${esc(klant)}</div><div class="sub">${esc(sub)}</div></div></div>`;
  const toon = st => taken.filter(t => t.st === st).map(t => rij(st, st === 'bezig' ? '🔧' : '🚐', t.klant + (t.plaats ? ', ' + t.plaats : ''), t.monteurs.join(' + ')));
  let rijen = toon('bezig').concat(toon('onderweg'));
  if (!rijen.length) {
    if (!taken.length) rijen = [rij('', '📅', HEUTE < 0 ? 'Weekend' : 'Geen taken vandaag', '')];
    else if (taken.every(t => t.st === 'klaar')) rijen = [rij('klaar', '✅', 'Alle monteurs klaar', 'Klaar voor vandaag')];
    else { const v = taken.find(t => t.st === 'gepland'); rijen = [rij('', '⏳', 'Tussendoor', v ? 'Volgende: ' + v.klant + ' · ' + v.van : '')]; }
  }
  W('wMonteurs').innerHTML = `<div class="w-kop"><span class="ic">👷</span>Monteurs zijn nu bij</div><div class="mon-lijst" style="justify-content:flex-start">${rijen.join('')}</div>
    <div style="margin-top:auto;font-size:15px;color:var(--grijs);display:flex;gap:18px">🚐 onderweg &nbsp; 🔧 aan het werk &nbsp; ✅ klaar</div>`;
}

// ── Klok en alles verversen ───────────────────────────────────
function tekenKlok() {
  document.getElementById('datum').textContent = new Date().toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  zet('klok', uurMin(nuMin()).replace(':', '<span class="dp">:</span>'));
}
function tekenAlles() {
  TAKEN.forEach(t => { t.st = bepaalStatus(t); });
  tekenKlok(); tekenPlanning(); tekenOffertes(); tekenFotos(); tekenMonteurs();
}

// ── Laden met foutafhandeling (een mislukte bron laat de rest gewoon werken) ──
async function ververs() {
  const fouten = [];
  const probeer = async (naam, f) => { try { await f(); } catch (e) { console.warn(naam, e); fouten.push(naam); } };
  await Promise.all([ probeer('planning', laadPlanning), probeer('taken', laadRegistratie), probeer('offertes', laadOffertes) ]);
  if (!fouten.length) laatstGeladen = new Date();
  tekenAlles();
  document.getElementById('bijgewerkt').textContent = laatstGeladen ? 'Bijgewerkt ' + uurMin(laatstGeladen.getHours() * 60 + laatstGeladen.getMinutes()) : 'Laden…';
  document.getElementById('melding').textContent = fouten.length ? '⚠️ Niet gelukt: ' + fouten.join(', ') + ' (probeert opnieuw)' : '';
}
async function verversFotos() { try { await laadFotos(); tekenFotos(); } catch (e) { console.warn('foto\'s', e); } }

function schaal() {
  uitschaal = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.getElementById('canvas').style.transform = `translate(-50%, -50%) scale(${uitschaal})`;
}
addEventListener('resize', () => { schaal(); tekenAlles(); });
addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } });

(async function start() {
  schaal(); tekenAlles();
  let ingelogd = false;
  try { ingelogd = await startAuth(); } catch (e) { console.error(e); toonLogin('Inloggen niet gelukt — probeer opnieuw'); return; }
  if (!ingelogd) { toonLogin(); return; }
  ververs(); verversFotos();
  setInterval(ververs, VERVERS_MS);
  setInterval(verversFotos, FOTO_VERVERS_MS);
  setInterval(tekenKlok, 1000);
  setInterval(tekenAlles, 15000);
})();
</script>
